# Port 8000 rather than 80, matching the sibling modules/api stack. tests/Http
# reaches it as http://localhost:8000 because phpunit runs in this container.
# The host port from docker/.env is mapped onto this one.
<VirtualHost *:8000>
    ServerName localhost
    DocumentRoot /var/www/html

    # To the container log, so `fa-sgw-sales logs app` shows something. Debian's
    # default sends both to files under /var/log/apache2, where nothing looks.
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>

# Debian's default vhost sets AllowOverride None for /var/www, which would
# silently discard FrontAccounting's own root .htaccess — the one that denies
# direct fetches of .inc and .sql files.
<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

# Nothing under these is fetched over HTTP, and they hold credentials, database
# dumps, and the git history of two repositories.
<DirectoryMatch "/var/www/html/(\.git|docker|node_modules|install/lang)">
    Require all denied
</DirectoryMatch>

# Anchored at the end: unanchored, "tmp" also denies a page named tmp-anything.php.
<DirectoryMatch "/var/www/html/modules/sgw_sales/(\.git|\.claude|docker|docs|node_modules|sql|tests|tmp|vendor)(/|$)">
    Require all denied
</DirectoryMatch>

<FilesMatch "^(config\.php|config_db\.php|installed_extensions\.php|composer\.(json|lock))$">
    Require all denied
</FilesMatch>

<DirectoryMatch "/var/www/html/company/[^/]+/(backup|attachments)">
    Require all denied
</DirectoryMatch>
