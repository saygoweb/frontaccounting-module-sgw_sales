name: CI

# Runs in the FrontAccounting CI image (cambell-prince/frontaccounting
# docker/ci) on FrontAccounting's demo company, with graphql activated
# alongside, as they are deployed: the module's own suites (tools/ci.sh), its
# GraphQL-extension suite (tools/ci-graphql.sh), and coverage from one cell.

on:
  push:
    branches:
      - master
      - 'feature/**'
      - 'fix/**'
      - 'bug/**'
      - 'issue/**'
      - 'ci/**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        fa: [cp, upstream]
        php: ['7.4', '8.3']
    uses: cambell-prince/frontaccounting/.github/workflows/plugin-test.yml@master-cp
    with:
      fa: ${{ matrix.fa }}
      php: ${{ matrix.php }}
      dataset: demo
      setup: composer install --no-interaction --no-progress
      # Activated with the module it is deployed with: they share one PHP
      # process, and so one Anorm (see tools/ci.sh). graphql's Bootstrap also
      # loads FrontAccounting for the integration suite.
      with: |
        graphql=https://github.com/saygoweb/frontaccounting-module-graphql.git@main
      test: sh tools/ci.sh

  graphql-extension:
    strategy:
      fail-fast: false
      matrix:
        fa: [cp, upstream]
        php: ['7.4', '8.3']
    uses: cambell-prince/frontaccounting/.github/workflows/plugin-test.yml@master-cp
    with:
      fa: ${{ matrix.fa }}
      php: ${{ matrix.php }}
      dataset: demo
      setup: composer install --no-interaction --no-progress && (cd ../graphql && composer install --no-interaction --no-progress)
      with: |
        graphql=https://github.com/saygoweb/frontaccounting-module-graphql.git@main
      test: sh tools/ci-graphql.sh

  # Coverage for the README's badge: tools/coverage.sh in one cell, both its
  # Clover reports sent to Codecov by plugin-test.yml.
  coverage:
    uses: cambell-prince/frontaccounting/.github/workflows/plugin-test.yml@master-cp
    with:
      fa: cp
      php: '8.3'
      dataset: demo
      setup: composer install --no-interaction --no-progress && (cd ../graphql && composer install --no-interaction --no-progress)
      with: |
        graphql=https://github.com/saygoweb/frontaccounting-module-graphql.git@main
      test: sh tools/coverage.sh
      coverage: build/coverage.xml,build/coverage-graphql.xml
    secrets:
      codecov-token: ${{ secrets.CODECOV_TOKEN }}
